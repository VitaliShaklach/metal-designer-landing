<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песочница — Metal Designer для цехов</title>
<link rel="icon" href="data:,">
<meta name="description" content="Соберите навес или мангал и сразу получите эскиз с размерами, длины реза, развёртки и массу металла.">
<style>
  :root {
    --paper: #f6f7f3;
    --ink: #1c2a40;
    --line: #2a3d5e;
    --muted: #4b5a70;
    --grid-major: rgba(42, 61, 94, .11);
    --grid-minor: rgba(42, 61, 94, .05);
    --accent: #c4480c;
    --accent-dark: #a33a08;
    --card: rgba(255, 255, 255, .78);
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* у кнопок свой display, без этого hidden их не прячет */
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  }
  a { color: var(--line); }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  h1 { font-size: clamp(26px, 6vw, 38px); font-weight: 800; }
  h3 { font-size: 20px; margin-bottom: 10px; }
  p { margin: 0; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Шапка */
  header { padding: 18px 0 8px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--line); }
  .brand span { font-weight: 400; color: var(--muted); }
  .back { font-size: 15px; }
  h1 { margin-top: 14px; }
  .private {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }

  /* Вкладки */
  .tabs { display: flex; gap: 6px; margin: 20px 0 0; overflow-x: auto; scrollbar-width: none; border-bottom: 2px solid var(--line); }
  .tab {
    flex: 0 0 auto;
    padding: 10px 14px;
    border: 2px solid var(--line);
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    background: var(--paper);
    font: 700 15px var(--sans);
    color: var(--line);
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--line); color: #fff; }
  .tab small { font: 400 11px var(--mono); opacity: .75; margin-left: 4px; }

  /* Вкладка */
  .panel { padding: 20px 0 48px; }
  .work { display: grid; gap: 20px; }
  .work > * { min-width: 0; }
  .sketch { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px; }
  .sketch svg { display: block; width: 100%; height: auto; max-height: 62vh; }
  .sketch figcaption { font-family: var(--mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }
  .params { display: grid; gap: 18px; align-content: start; }
  .field label { display: flex; justify-content: space-between; font-weight: 700; }
  .field output { font-family: var(--mono); font-weight: 700; color: var(--accent-dark); }
  .field input[type="range"] { width: 100%; height: 36px; accent-color: var(--accent); }
  .hint { font-size: 14px; color: var(--muted); }
  .fixed { font-size: 14px; color: var(--muted); }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border: 2px solid var(--accent);
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font: 700 17px var(--sans);
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }

  /* Результат */
  .result { margin-top: 24px; background: var(--card); border: 2px solid var(--line); border-radius: 4px; padding: 18px; scroll-margin-top: 12px; }
  .parts { list-style: none; margin: 0; padding: 0; }
  .parts li { padding: 8px 0; border-top: 1px dashed rgba(42, 61, 94, .35); }
  .parts li:first-child { border-top: 0; }
  .part-name { display: block; font-weight: 600; }
  .part-meta { display: block; font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .total { margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--line); font-size: 19px; }
  .note { margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* Раскрой хлыстов и площади */
  .calc-block { margin-top: 24px; padding-top: 18px; border-top: 2px solid var(--line); }
  .calc-block .hint { margin-bottom: 6px; }
  .stock { margin-top: 14px; }
  .stock-head { font-family: var(--mono); font-size: 14px; }
  .stock-head b { font-size: 16px; }
  .bars { list-style: none; margin: 6px 0 0; padding: 0; }
  .bars li { padding: 5px 0; }
  /* Хлыст целиком — заштрихованный обрезок, поверх куски в масштабе, между ними зазор реза */
  .bar {
    display: flex;
    height: 14px;
    border: 1px solid var(--line);
    background: repeating-linear-gradient(-45deg, transparent 0 3px, rgba(196, 72, 12, .45) 3px 4px);
  }
  .bar span { background: var(--line); border-right: 2px solid var(--paper); }
  .bar-text { font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .bar-text b { color: var(--ink); }
  .warn { margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--accent-dark); }

  /* Лист чертежа и сохранение */
  .sheet-block { display: grid; gap: 14px; margin-top: 24px; padding-top: 18px; border-top: 2px solid var(--line); }
  .sheet-block h3 { margin: 0; }
  .field input[type="text"] {
    width: 100%;
    margin-top: 4px;
    padding: 11px 12px;
    border: 2px solid var(--line);
    border-radius: 4px;
    background: #fff;
    font: 17px var(--sans);   /* не меньше 16 px, иначе айфон приближает страницу при вводе */
    color: var(--ink);
  }
  .field input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .sheet-preview { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
  .save { display: grid; gap: 10px; }
  .btn-ghost { background: transparent; color: var(--accent-dark); }
  .btn-ghost:hover { color: #fff; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .print-sheet { display: none; }

  /* Ссылка на вариант и полная версия */
  .share-block { display: grid; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 2px solid var(--line); }
  .link-field {
    width: 100%;
    padding: 11px 12px;
    border: 2px solid var(--accent);
    border-radius: 4px;
    background: #fff;
    font: 16px var(--mono);   /* не меньше 16 px, иначе айфон приближает страницу */
    color: var(--ink);
  }
  .btn-soon:disabled { background: transparent; border-color: var(--muted); color: var(--muted); opacity: 1; cursor: not-allowed; }

  /* Переключатели: кнопки в ряд, нажатая залита */
  .choice { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .choice legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 700; }
  .choice button {
    flex: 1 1 0;
    min-height: 44px;
    padding: 8px 10px;
    border: 2px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    font: 600 15px var(--sans);
    color: var(--line);
    cursor: pointer;
  }
  .choice button[aria-pressed="true"] { background: var(--line); color: #fff; }
  .choice button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Развёртки */
  .unfolds { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .unfold { padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .unfold svg { display: block; width: 100%; height: auto; max-height: 170px; margin: 6px 0; }

  .soon { padding: 32px 0; color: var(--muted); }
  .soon b { color: var(--ink); }

  @media (min-width: 860px) {
    .wrap { padding: 0 32px; }
    .work { grid-template-columns: 300px 1fr; gap: 32px; }
    /* эскиз вместе с размерами помещается в окно под шапкой и вкладками */
    .sketch svg { max-height: max(300px, calc(100vh - 290px)); }
    .work .params { order: 0; }
    .work .sketch { order: 1; }
  }
  @media (max-width: 520px) {
    .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 0; }
    .tab { border-bottom: 2px solid var(--line); border-radius: 4px; }
  }
  @media (max-width: 859px) {
    .work .sketch { order: 0; }
    .work .params { order: 1; }
  }
  @media (min-width: 521px) {
    .save { grid-template-columns: 1fr 1fr; }
    .save-wide { grid-column: 1 / -1; }
  }

  /* Печать: только лист, A4 альбомом. Поля страницы нулевые, чтобы браузер не печатал свои колонтитулы,
     отступ от края даёт сам блок. Высота листа ограничена, чтобы он влез на одну страницу и при книжной ориентации. */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    body > :not(.print-sheet) { display: none !important; }
    .print-sheet { display: block; padding: 6mm; }
    .print-sheet img { display: block; width: 100%; height: auto; max-height: 190mm; object-fit: contain; break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <p class="brand">Metal Designer <span>· песочница</span></p>
    <a class="back" href="index.html">← Что это за продукт</a>
  </div>
  <h1>Соберите изделие и отправьте в производство</h1>
  <p class="private">Ваши проекты и фото никуда не отправляются — видите только вы.</p>

  <nav class="tabs" role="tablist" aria-label="Изделия">
    <button class="tab" role="tab" data-tab="naves">Навес</button>
    <button class="tab" role="tab" data-tab="mangal">Мангал</button>
    <button class="tab" role="tab" data-tab="pech">Печь<small>скоро</small></button>
    <button class="tab" role="tab" data-tab="custom">Ваше изделие<small>скоро</small></button>
  </nav>
</header>

<main class="wrap">
  <section class="panel" data-panel="naves" role="tabpanel">
    <div class="work">
      <div class="params">
        <div class="field">
          <label for="naves-width">Ширина <output data-out="width"></output></label>
          <input type="range" id="naves-width" data-key="width">
        </div>
        <div class="field">
          <label for="naves-height">Высота <output data-out="height"></output></label>
          <input type="range" id="naves-height" data-key="height">
          <p class="hint" data-text="heightHint"></p>
        </div>
        <p class="fixed" data-text="fixed"></p>
        <button class="btn produce" type="button">В производство</button>
      </div>
      <figure class="sketch">
        <div class="sketch-box"></div>
        <figcaption>Навес. Вид спереди. Размеры в мм.</figcaption>
      </figure>
    </div>
    <div class="result" hidden></div>
  </section>

  <section class="panel" data-panel="mangal" role="tabpanel" hidden>
    <div class="work">
      <div class="params">
        <div class="field">
          <label for="mangal-length">Длина <output data-out="length"></output></label>
          <input type="range" id="mangal-length" data-key="length">
        </div>
        <div class="field">
          <label for="mangal-width">Ширина <output data-out="width"></output></label>
          <input type="range" id="mangal-width" data-key="width">
        </div>
        <div class="field">
          <label for="mangal-height">Высота <output data-out="height"></output></label>
          <input type="range" id="mangal-height" data-key="height">
          <p class="hint" data-text="heightHint"></p>
        </div>
        <fieldset class="field choice" data-key="thickness"><legend>Толщина металла</legend></fieldset>
        <fieldset class="field choice" data-key="blow"><legend>Дырочки поддува</legend></fieldset>
        <fieldset class="field choice" data-key="legs"><legend>Ножки</legend></fieldset>
        <fieldset class="field choice" data-key="wheels"><legend>Колёса</legend></fieldset>
        <p class="fixed" data-text="fixed"></p>
        <button class="btn produce" type="button">В производство</button>
      </div>
      <figure class="sketch">
        <div class="sketch-box"></div>
        <figcaption>Мангал. Вид спереди и сбоку. Размеры в мм.</figcaption>
      </figure>
    </div>
    <div class="result" hidden></div>
  </section>
  <section class="panel" data-panel="pech" role="tabpanel" hidden>
    <p class="soon"><b>Печь под казан — скоро.</b></p>
  </section>
  <section class="panel" data-panel="custom" role="tabpanel" hidden>
    <p class="soon"><b>Ваше изделие — скоро.</b></p>
  </section>
</main>

<!-- Результат вкладки под расчётом: лист чертежа, сохранение, ссылка на вариант. Копируется в каждую вкладку с изделием. -->
<template id="result-tpl">
  <div class="calc"></div>
  <div class="sheet-block">
    <h3>Лист чертежа</h3>
    <div class="field">
      <label>Цех и телефон</label>
      <input type="text" class="shop-input" maxlength="80" autocomplete="organization" placeholder="Лазер-Мастер, +7 900 123-45-67">
      <p class="hint">Впишите один раз: браузер запомнит и поставит в штамп каждого листа.</p>
    </div>
    <img class="sheet-preview" alt="">
    <div class="save">
      <button class="btn js-png" type="button">Скачать картинку</button>
      <button class="btn btn-ghost js-pdf" type="button">PDF для печати</button>
      <button class="btn btn-ghost js-dxf save-wide" type="button" hidden>DXF под лазер</button>
    </div>
    <p class="hint ios-hint" hidden>Если картинка открылась вкладкой, нажмите «Поделиться» → «Сохранить изображение». DXF айфон кладёт в «Файлы» → «Загрузки».</p>
  </div>
  <div class="share-block">
    <button class="btn btn-ghost js-link" type="button">Ссылка на вариант</button>
    <input type="text" class="link-field" readonly hidden aria-label="Ссылка на вариант">
    <p class="hint link-status" role="status">Кто откроет ссылку, увидит этот же вариант с теми же размерами.</p>
    <button class="btn btn-soon js-full" type="button" disabled>Полная версия — скоро</button>
  </div>
</template>

<!-- Лист для «PDF для печати»: на экране скрыт, при печати виден только он -->
<div class="print-sheet"><img id="print-sheet" alt=""></div>

<script src="js/metal.js"></script>
<script src="js/naves.js"></script>
<script src="js/cutting.js"></script>
<script src="js/sketch-naves.js"></script>
<script src="js/sketch-kit.js"></script>
<script src="js/mangal.js"></script>
<script src="js/sketch-mangal.js"></script>
<script src="js/unfold.js"></script>
<script src="js/dxf.js"></script>
<script src="js/shop.js"></script>
<script src="js/sheet.js"></script>
<script src="js/link.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
